name: 生成导览配音

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['narration/**', 'tools/gen_tts.py']

permissions:
  contents: write

concurrency:
  group: tts
  cancel-in-progress: false

jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 用 MiniMax 生成音频
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          MINIMAX_API_HOST: ${{ vars.MINIMAX_API_HOST }}
          MINIMAX_VOICE_ID: ${{ vars.MINIMAX_VOICE_ID }}
          MINIMAX_MODEL: ${{ vars.MINIMAX_MODEL }}
          MINIMAX_SPEED: ${{ vars.MINIMAX_SPEED }}
          MINIMAX_VOICE_ID_EN: ${{ vars.MINIMAX_VOICE_ID_EN }}
        run: |
          python3 tools/gen_tts.py
          python3 tools/gen_tts.py --lang en
      - name: 提交生成的音频
        run: |
          git add audio
          if git diff --cached --quiet; then echo "音频没有变化"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update tour voice-over audio"
          git push
